# Generates the study's data set inside Aurora. Applied by the pipeline's verify step
# when no job for this seed version exists; the job itself does nothing if the data set
# is already loaded. __IMAGE__ and __VERSION__ are filled in by ci/verify.sh.
apiVersion: batch/v1
kind: Job
metadata:
  name: storefront-seed-__VERSION__
  namespace: storefront
  labels:
    app: storefront-seed
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app: storefront-seed
    spec:
      serviceAccountName: storefront-api
      restartPolicy: Never
      # The work happens in the database; the job only issues the statements.
      nodeSelector:
        tier: system
      containers:
        - name: seed
          image: __IMAGE__
          args:
            - --storefront.seed.enabled=true
            - --storefront.seed.version=__VERSION__
            - --spring.main.web-application-type=none
            - --storefront.db.socket-timeout-millis=0
            - --storefront.db.pool-size=8
          envFrom:
            - configMapRef:
                name: storefront-env
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              memory: 1Gi
