<title id="gu-arch-cmp-t">Graviton2 baseline and right-sized Graviton5 stack, tier by tier</title>
<desc id="gu-arch-cmp-d">Side-by-side comparison of the Graviton2 baseline and the right-sized Graviton5 stack: instance types, vCPUs and pods of each tier, and the measured CPU utilization, capacity and cost.</desc>
<text class="gu-title" x="0" y="18">Graviton2 baseline and right-sized Graviton5 stack, tier by tier</text>
<text class="gu-sub" x="0" y="37">The same request rate, request mix and container images, on half the vCPUs in three tiers.</text>
