<title id="gu-rated-t">Graviton2 and Graviton5 at the comparison load of 11,800 requests per second</title>
<desc id="gu-rated-d">Bar chart of the CPU utilization of the web tier, the API tier and the database writer of the configurations measured at 11,800 requests per second and of those shown from a staircase step near it, against the ceiling of 80% CPU utilization, and a dot plot of their p50, p95 and p99 response time.</desc>
<text class="gu-title" x="0" y="18">Graviton2 and Graviton5 at the comparison load of 11,800 requests per second</text>
<text class="gu-sub" x="0" y="37">A and C: median of 3 runs of 590 seconds. B: one 110-second step at 12,000 requests per second.</text>
