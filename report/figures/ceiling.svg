<title id="gu-ceiling-t">CPU utilization of the busiest tier as the request rate rises</title>
<desc id="gu-ceiling-d">Line chart of the busiest tier&#x27;s CPU utilization against request rate for each configuration, with the 80% ceiling, the rate at which each configuration reaches it, and each configuration&#x27;s utilization at the comparison load.</desc>
<text class="gu-title" x="0" y="18">CPU utilization of the busiest tier as the request rate rises</text>
<text class="gu-sub" x="0" y="37">Lines: each passing 110-second step of the capacity run. Diamonds: the 80% ceiling, from a 10-minute run near it.</text>
