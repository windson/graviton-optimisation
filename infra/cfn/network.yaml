AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  graviton-uplift - network. One VPC across two Availability Zones with public subnets
  (load balancer, NAT gateway), private subnets (EKS nodes), and isolated subnets (Aurora).

Parameters:
  ProjectName:
    Type: String
    Default: graviton-uplift
  VpcCidr:
    Type: String
    Default: 10.80.0.0/16
  AvailabilityZoneA:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-west-2a
  AvailabilityZoneB:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-west-2b
  ClusterName:
    Type: String
    Default: graviton-uplift
    Description: EKS cluster name, used for the subnet discovery tags read by the AWS Load Balancer Controller.

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Ref ProjectName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Ref ProjectName

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  # ---- Public subnets: internet-facing load balancer and the NAT gateway --------------------
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZoneA
      CidrBlock: !Select [0, !Cidr [!Ref VpcCidr, 16, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-a
        - Key: kubernetes.io/role/elb
          Value: "1"
        - Key: !Sub kubernetes.io/cluster/${ClusterName}
          Value: shared

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZoneB
      CidrBlock: !Select [1, !Cidr [!Ref VpcCidr, 16, 12]]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public-b
        - Key: kubernetes.io/role/elb
          Value: "1"
        - Key: !Sub kubernetes.io/cluster/${ClusterName}
          Value: shared

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-public

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  # A single NAT gateway keeps the study inside the account's Elastic IP quota.
  # A production deployment would run one per Availability Zone.
  NatElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-nat

  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatElasticIp.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: !Ref ProjectName

  # ---- Private subnets: EKS nodes and pods -------------------------------------------------
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZoneA
      CidrBlock: !Select [4, !Cidr [!Ref VpcCidr, 16, 12]]
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-a
        - Key: kubernetes.io/role/internal-elb
          Value: "1"
        - Key: !Sub kubernetes.io/cluster/${ClusterName}
          Value: shared

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZoneB
      CidrBlock: !Select [5, !Cidr [!Ref VpcCidr, 16, 12]]
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private-b
        - Key: kubernetes.io/role/internal-elb
          Value: "1"
        - Key: !Sub kubernetes.io/cluster/${ClusterName}
          Value: shared

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-private

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetA
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetB
      RouteTableId: !Ref PrivateRouteTable

  # ---- Isolated subnets: Aurora. No route to the internet ----------------------------------
  DataSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZoneA
      CidrBlock: !Select [8, !Cidr [!Ref VpcCidr, 16, 12]]
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-data-a

  DataSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !Ref AvailabilityZoneB
      CidrBlock: !Select [9, !Cidr [!Ref VpcCidr, 16, 12]]
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-data-b

  DataRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - Key: Name
          Value: !Sub ${ProjectName}-data

  DataSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DataSubnetA
      RouteTableId: !Ref DataRouteTable

  DataSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref DataSubnetB
      RouteTableId: !Ref DataRouteTable

  # Gateway endpoint so image layers pulled from Amazon ECR (stored in S3) bypass the NAT gateway.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.s3
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export:
      Name: !Sub ${ProjectName}:VpcId
  VpcCidr:
    Value: !Ref VpcCidr
    Export:
      Name: !Sub ${ProjectName}:VpcCidr
  PublicSubnetIds:
    Value: !Join [",", [!Ref PublicSubnetA, !Ref PublicSubnetB]]
    Export:
      Name: !Sub ${ProjectName}:PublicSubnetIds
  PrivateSubnetIds:
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
    Export:
      Name: !Sub ${ProjectName}:PrivateSubnetIds
  PrivateSubnetCidrA:
    Value: !GetAtt PrivateSubnetA.CidrBlock
    Export:
      Name: !Sub ${ProjectName}:PrivateSubnetCidrA
  PrivateSubnetCidrB:
    Value: !GetAtt PrivateSubnetB.CidrBlock
    Export:
      Name: !Sub ${ProjectName}:PrivateSubnetCidrB
  DataSubnetIds:
    Value: !Join [",", [!Ref DataSubnetA, !Ref DataSubnetB]]
    Export:
      Name: !Sub ${ProjectName}:DataSubnetIds
  AvailabilityZoneA:
    Value: !Ref AvailabilityZoneA
    Export:
      Name: !Sub ${ProjectName}:AvailabilityZoneA
  AvailabilityZoneB:
    Value: !Ref AvailabilityZoneB
    Export:
      Name: !Sub ${ProjectName}:AvailabilityZoneB
